# Local Supabase stack settings. This project is deliberately not linked to
# production by default. `db.major_version` matches the live project's PG 17.
project_id = "rkh-ledger-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]

[db.seed]
enabled = false
